<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>监考栏</title>
    <link rel="stylesheet" href="/src/guard.css" />
    <script type="module" src="/src/guard.ts" defer></script>
  </head>
  <body class="toolbar-body">
    <div class="toolbar">
      <div class="brand">
        <strong>Interview3S</strong>
        <span id="enabled-text" class="pill">—</span>
      </div>

      <div class="metrics">
        <span>切屏 <strong id="violations">0</strong></span>
        <span>前台 <strong id="foreground">—</strong></span>
        <span>屏数 <strong id="monitors">1</strong></span>
        <span>截屏 <strong id="shots">0</strong></span>
        <span class="title-snip" id="title" title="">—</span>
      </div>

      <div class="toolbar-actions">
        <button id="toggle-guard" type="button">关闭守卫</button>
        <button id="toggle-pull" type="button" class="secondary">强拉：关</button>
        <button id="tile" type="button" class="secondary">与腾讯会议分屏</button>
        <button id="topmost" type="button" class="secondary">置顶：开</button>
        <button id="toggle-capture" type="button" class="secondary">截屏：开</button>
      </div>
    </div>
    <p id="hint" class="hint bar-hint"></p>
    <p id="status" class="status bar-status"></p>
  </body>
</html>
