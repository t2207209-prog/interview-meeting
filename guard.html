<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>监考栏</title>
    <link rel="stylesheet" href="/src/guard.css" />
    <script type="module" src="/src/guard.ts" defer></script>
  </head>
  <body class="toolbar-body">
    <div class="toolbar">
      <div class="brand">
        <strong>Interview3S</strong>
      </div>

      <div class="metrics">
        <span>切屏 <strong id="violations">0</strong></span>
        <span>前台 <strong id="foreground">—</strong></span>
        <span>屏数 <strong id="monitors">1</strong></span>
        <span>截屏数 <strong id="shots">0</strong></span>
        <span class="title-snip" id="title" title="">—</span>
      </div>

      <div class="status-lamps" aria-label="监考状态">
        <span class="lamp" id="lamp-guard" data-on="0">守卫关</span>
        <span class="lamp" id="lamp-pull" data-on="0">强拉关</span>
        <span class="lamp" id="lamp-tile" data-on="0">并排关</span>
        <span class="lamp" id="lamp-topmost" data-on="0">置顶关</span>
        <span class="lamp" id="lamp-capture" data-on="0">截屏关</span>
      </div>
    </div>
    <p id="hint" class="hint bar-hint"></p>
    <p id="status" class="status bar-status"></p>
  </body>
</html>
