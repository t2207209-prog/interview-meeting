<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Meeting</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <p class="eyebrow">Interview Meeting MVP</p>
        <h1>单窗口嵌入腾讯会议 Web</h1>
        <p class="lead">
          右侧内嵌官网页面。注意：大陆官网「加入」默认唤起客户端，不是完整网页会议室。
        </p>
      </header>

      <form id="join-form" class="panel">
        <label for="meeting-id">会议号</label>
        <input
          id="meeting-id"
          name="meetingId"
          inputmode="numeric"
          autocomplete="off"
          placeholder="例如 123-456-789"
          required
        />
        <div class="actions">
          <button type="submit" id="join-btn">打开邀请链接页</button>
          <button type="button" id="center-btn" class="secondary">打开用户中心入会</button>
          <button type="button" id="native-btn" class="secondary">允许唤起客户端一次</button>
          <button type="button" id="home-btn" class="secondary">回到会议首页</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </form>

      <section class="notes">
        <h2>为什么会闪一下又回来？</h2>
        <ol>
          <li>右侧点「加入」→ 进入「启动中…」→ 尝试 <code>wemeet://</code> 打开本机客户端。</li>
          <li>本应用默认拦截该协议，客户端拉不起来，页面又退回入会表单，看起来像闪烁。</li>
          <li>若只想先完成入会验证：点「允许唤起客户端一次」，再在右侧点「加入」（会跳出独立窗口）。</li>
          <li>若要坚持单窗口内音视频：需要腾讯会议开放平台 / 官方 SDK，不能只靠嵌网页。</li>
        </ol>
      </section>
    </div>
  </body>
</html>
