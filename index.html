<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Meeting</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <p class="eyebrow">Interview Meeting MVP</p>
        <h1>单窗口嵌入腾讯会议 Web</h1>
        <p class="lead">
          左侧业务区 · 右侧内嵌
          <code>meeting.tencent.com</code>
          · 同一系统窗口
        </p>
      </header>

      <form id="join-form" class="panel">
        <label for="meeting-id">会议号</label>
        <input
          id="meeting-id"
          name="meetingId"
          inputmode="numeric"
          autocomplete="off"
          placeholder="例如 123-456-789"
          required
        />
        <div class="actions">
          <button type="submit" id="join-btn">在右侧入会</button>
          <button type="button" id="home-btn" class="secondary">回到会议首页</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </form>

      <section class="notes">
        <h2>使用说明</h2>
        <ol>
          <li>输入会议号后点「在右侧入会」，右侧加载官方入会页。</li>
          <li>右侧再点「加入会议」时，客户端协议 <code>wemeet://</code> 会被拦截，并尽量自动切到网页入会（可能需要先登录腾讯会议账号）。</li>
          <li>若仍停在引导页，请手动点「浏览器入会 / 从浏览器加入」。</li>
          <li>摄像头 / 麦克风权限已在右侧视图中默认允许（仍可能弹出系统授权）。</li>
        </ol>
      </section>
    </div>
  </body>
</html>
